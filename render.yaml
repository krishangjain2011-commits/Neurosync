services:
  - type: web
    name: neurosync
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GROQ_API_KEY
        scope: secret
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DB_PATH
        value: /data/neurosync.db
      - key: UPLOADS_DIR
        value: /data/uploads

  - type: static site
    name: diagnostic-engine
    env: node
    buildCommand: cd diagnostic-engine && npm install && npm run build
    staticPublishPath: diagnostic-engine/.next
    routes:
      - path: /diagnostics/*
        destination: /diagnostic-engine

disks:
  - name: neurosync-data
    mountPath: /data
    sizeGB: 1
